name: Verify reported release
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**
      - tests/verify_reported_release.py
      - .github/workflows/verify-reported-release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify source data and deployed release
        run: python tests/verify_reported_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reported-release-verification
          path: verification/
          retention-days: 3
