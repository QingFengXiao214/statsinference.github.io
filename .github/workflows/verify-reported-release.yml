name: Verify reported release
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**
      - tests/verify_reported_release.py
      - tests/verify_method_references.py
      - .github/workflows/verify-reported-release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify source data and deployed release
        run: python tests/verify_reported_release.py
      - name: Wait for the deployed reference assets
        run: |
          python - <<'PY'
          import os, pathlib, time, urllib.request
          expected = pathlib.Path('assets/references.js').read_bytes()
          for attempt in range(24):
              try:
                  url = 'https://statsinference.github.io/assets/references.js?verify=' + os.environ['GITHUB_SHA'] + '-' + str(attempt)
                  if urllib.request.urlopen(url, timeout=15).read() == expected:
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise AssertionError('Expected method references were not deployed')
          PY
      - name: Check deployed method citations and unchanged metrics
        env:
          ARENA_TEST_URL: https://statsinference.github.io/?verify=${{ github.sha }}
        run: |
          node --check assets/references.js
          python tests/verify_method_references.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reported-release-verification
          path: verification/
          retention-days: 3
